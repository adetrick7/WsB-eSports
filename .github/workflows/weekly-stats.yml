name: Daily Fortnite Stats Snapshot

on:
  schedule:
    # Daily at 3:17 AM Los Angeles time. An odd minute avoids the busiest Actions queue period.
    - cron: "17 3 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch: {}
    # Lets you trigger this manually from the Actions tab any time —
    # useful for the very first run instead of waiting for Monday.

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch today's stats
        env:
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
        run: node scripts/fetch-weekly-stats.js

      - name: Commit and push updated snapshots
        run: |
          git config user.name "wsb-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/previous.json
          git diff --quiet --cached || git commit -m "Daily stats snapshot: $(date -u +'%Y-%m-%d')"
          git push
